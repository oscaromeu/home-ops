---
version: '3'

tasks:

  test:
    desc: 'Validate a cluster offline with flate (task rs:test cluster=home)'
    cmd: 'flate test all --path {{.KUBERNETES_DIR}}/clusters/{{.cluster}}/flux --allow-missing-secrets'
    vars:
      cluster: '{{.cluster | default "home"}}'
    preconditions:
      - which flate

  render:
    desc: 'Render everything a cluster applies (task rs:render cluster=home)'
    cmd: 'flate build all --path {{.KUBERNETES_DIR}}/clusters/{{.cluster}}/flux --allow-missing-secrets'
    vars:
      cluster: '{{.cluster | default "home"}}'
    preconditions:
      - which flate
