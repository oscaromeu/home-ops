---
- name: Get deployed k3s version
  ansible.builtin.command: k3s --version
  register: k3s_version
  changed_when: false
  failed_when: false

- name: Extract k3s version
  ansible.builtin.set_fact:
    current_k3s_version: "{{ k3s_version.stdout | regex_replace('(?im)k3s version (?P<version>[a-z0-9\\.\\+]+).*\n.*', '\\g<version>') if k3s_version.rc == 0 else '' }}"

- name: Prevent downgrades
  when: current_k3s_version | length > 0
  ansible.builtin.assert:
    that: ["k3s_release_version is version(current_k3s_version, '>=')"]
    fail_msg: "Deployed k3s ({{ current_k3s_version }}) is newer than k3s_release_version ({{ k3s_release_version }})"
