---
- name: Fetch the kubeconfig from the node
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /tmp/kubeconfig-{{ cluster_name }}
    flat: true

- name: Point it at the node and name everything after the cluster
  delegate_to: localhost
  become: false
  ansible.builtin.command: >-
    yq -i '
      (.clusters[0].name, .contexts[0].name, .contexts[0].context.cluster,
       .contexts[0].context.user, .users[0].name, .current-context) = "{{ cluster_name }}" |
      .clusters[0].cluster.server = "https://{{ ansible_host }}:6443"
    ' /tmp/kubeconfig-{{ cluster_name }}
  changed_when: true

- name: Merge the cluster into ~/.kube/config
  delegate_to: localhost
  become: false
  ansible.builtin.shell: |
    set -eu
    config="${KUBECONFIG:-$HOME/.kube/config}"
    # Resolve the symlink so a nix-managed config is updated in place
    if [ -e "$config" ]; then
      target="$(readlink -f "$config")"
      current="$(kubectl config --kubeconfig="$config" current-context 2>/dev/null || true)"
    else
      target="$config"
      current=""
    fi
    KUBECONFIG="/tmp/kubeconfig-{{ cluster_name }}:$config" kubectl config view --flatten > /tmp/kubeconfig-merged
    install -D -m 600 /tmp/kubeconfig-merged "$target"
    kubectl config --kubeconfig="$target" use-context "${current:-{{ cluster_name }}}" > /dev/null
    rm /tmp/kubeconfig-{{ cluster_name }} /tmp/kubeconfig-merged
  changed_when: true
