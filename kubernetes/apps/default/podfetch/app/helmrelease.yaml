---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app podfetch
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    controllers:
      podfetch:
        containers:
          app:
            image:
              repository: ghcr.io/samtv12345/podfetch
              tag: v4.9.0@sha256:11ef3e5b6394bfad1f91cc27b33972dd908b12a87200b9f5c7d39200906cc62a
            env:
              TZ: "${TZ}"
              PORT: &port 8000
              POLLING_INTERVAL: 60
              DATABASE_URL: sqlite:///app/db/podcast.db
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 44
          - 65537
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: podfetch
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "podfetch.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      db:
        existingClaim: podfetch-db
        globalMounts:
          - path: /app/db
      tmp:
        type: emptyDir
      podcasts:
        type: nfs
        server: ${REBOST_IP}
        path: ${REBOST_MEDIA_PATH}/Library/Media/Podcasts
        globalMounts:
          - path: /app/podcasts
