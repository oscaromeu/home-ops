---
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: memos
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  displayname: Memos
  origin: https://memos.${SECRET_DOMAIN}/
  redirectUrl:
    - https://memos.${SECRET_DOMAIN}/auth/callback
  scopeMap:
    - group: memos_users@idm.${SECRET_DOMAIN}
      scopes:
        - openid
        - profile
        - email
        - groups
  strictRedirectUrl: true
  disableConsentPrompt: true
