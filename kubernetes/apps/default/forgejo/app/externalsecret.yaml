---
# Generated once in-cluster and never rotated: SECRET_KEY encrypts data at
# rest and INTERNAL_TOKEN only needs to be a stable shared string.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-secret-key
spec:
  refreshPolicy: CreatedOnce
  target:
    name: forgejo-secret-key
    template:
      data:
        SECRET_KEY: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: forgejo-secret-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-internal-token
spec:
  refreshPolicy: CreatedOnce
  target:
    name: forgejo-internal-token
    template:
      data:
        INTERNAL_TOKEN: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: forgejo-internal-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-admin-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: forgejo-admin-secret
    creationPolicy: Owner
    deletionPolicy: "Delete"
    template:
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  dataFrom:
    - extract:
        key: forgejo
