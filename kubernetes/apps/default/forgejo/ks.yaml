---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: forgejo
spec:
  dependsOn:
    - name: onepassword
      namespace: external-secrets
    - name: envoy-gateway
      namespace: network
    - name: crunchy-postgres-cluster-clusterexternalsecrets
      namespace: databases
  path: ./kubernetes/apps/default/forgejo/app
  targetNamespace: default
