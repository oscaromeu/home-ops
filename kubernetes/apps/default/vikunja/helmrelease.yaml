---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app vikunja
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: vikunja
  values:
    controllers:
      vikunja:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: vikunja/vikunja
              tag: 2.7.0@sha256:e2204a1c1c6a81e833c2b3a5442be182ca2335b54c2e7e37578cc3fe12a27cfc
            envFrom:
              - secretRef:
                  name: vikunja-service-jwt-secret
            env:
              VIKUNJA_SERVICE_PUBLICURL: &host "https://{{ .Release.Name }}.${SECRET_DOMAIN}"
              VIKUNJA_DATABASE_TYPE: postgres
              VIKUNJA_DATABASE_HOST:
                valueFrom:
                  secretKeyRef:
                    name: vikunja-postgres-credentials
                    key: host
              VIKUNJA_DATABASE_DATABASE:
                valueFrom:
                  secretKeyRef:
                    name: vikunja-postgres-credentials
                    key: dbname
              VIKUNJA_DATABASE_USER:
                valueFrom:
                  secretKeyRef:
                    name: vikunja-postgres-credentials
                    key: user
              VIKUNJA_DATABASE_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: vikunja-postgres-credentials
                    key: password
              INIT_POSTGRES_DBNAME:
                valueFrom:
                  secretKeyRef:
                    name: vikunja-postgres-credentials
                    key: INIT_POSTGRES_DBNAME
              INIT_POSTGRES_HOST:
                valueFrom:
                  secretKeyRef:
                    name: vikunja-postgres-credentials
                    key: INIT_POSTGRES_HOST
              INIT_POSTGRES_USER:
                valueFrom:
                  secretKeyRef:
                    name: vikunja-postgres-credentials
                    key: INIT_POSTGRES_USER
              INIT_POSTGRES_PASS:
                valueFrom:
                  secretKeyRef:
                    name: vikunja-postgres-credentials
                    key: INIT_POSTGRES_PASS
              INIT_POSTGRES_SUPER_PASS:
                valueFrom:
                  secretKeyRef:
                    name: vikunja-postgres-credentials
                    key: INIT_POSTGRES_SUPER_PASS
              "config.yml": |
                auth:
                  local:
                    enabled: false
            resources:
              requests:
                cpu: 5m
                memory: 10Mi
              limits:
                memory: 100Mi
    service:
      app:
        controller: *app
        ports:
          http:
            port: &port 3456
    route:
      app:
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      config:
        existingClaim: *app
        advancedMounts:
          vikunja:
            app:
              - path: /db
                subPath: db
              - path: /app/vikunja/files
                subPath: files