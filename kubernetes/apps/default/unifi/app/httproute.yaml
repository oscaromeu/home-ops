---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
# NOTE: backend (10.69.1.1:443) serves HTTPS with a self-signed cert. Without a
# BackendTLSPolicy targeting this route, Envoy forwards plain HTTP to that port
# and requests will fail. Add a BackendTLSPolicy (with the controller's CA cert)
# once available — see docs.oscaromeu.io migration notes for the pending step.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: unifi
spec:
  hostnames:
    - &host unifi.${SECRET_DOMAIN}
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: unifi
          port: 443
