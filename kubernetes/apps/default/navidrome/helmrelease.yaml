---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-4.4.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: navidrome
spec:
  chartRef:
    kind: OCIRepository
    name: navidrome
  values:
    controllers:
      navidrome:
        containers:
          app:
            image:
              repository: ghcr.io/navidrome/navidrome
              tag: 0.64.2@sha256:38dc2727bfcfd5ede290f8ada114fc90368146f265ae4701ddddbcbe2a44ee52
            envFrom:
              - secretRef:
                  name: navidrome
            env:
              TZ: "${TZ}"
              ND_DATAFOLDER: /config
              ND_MUSICFOLDER: /collection
              ND_ENABLEGRAVATAR: "true"
              ND_LOGLEVEL: info
              ND_DEFAULTTHEME: Spotify-ish
              ND_PORT: &port 8080
              ND_BACKUP_PATH: /backup
              ND_BACKUP_SCHEDULE: "@daily"
              ND_BACKUP_COUNT: "7"
              ND_REVERSEPROXYUSERHEADER: "X-Forwarded-Preferred-Username"
              ND_REVERSEPROXYWHITELIST: "${CLUSTER_POD_CIDR}"
              ND_SCANSCHEDULE: "@every 5m"
              ND_SESSIONTIMEOUT: 24h
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 10m
                memory: 250Mi
              limits:
                memory: 750Mi
      oauth2-proxy:
        containers:
          app:
            image:
              repository: quay.io/oauth2-proxy/oauth2-proxy
              tag: v7.15.5@sha256:8498b0d0ef0a7b29686414000a08aee467f02d0299c9ed1e006a8f33fc017916
            args:
              - --http-address=0.0.0.0:4180
              - --provider=oidc
              - --oidc-issuer-url=https://idm.${SECRET_DOMAIN}/oauth2/openid/navidrome
              - --client-id=navidrome
              - --code-challenge-method=S256
              - --email-domain=*
              - --redirect-url=https://navidrome.${SECRET_DOMAIN}/oauth2/callback
              - --upstream=http://navidrome.default.svc.cluster.local:8080
              - --skip-provider-button=true
              - --pass-user-headers=true
              - --reverse-proxy=true
              - --cookie-secure=true
            env:
              OAUTH2_PROXY_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: navidrome-kanidm-oauth2-credentials
                    key: CLIENT_SECRET
              OAUTH2_PROXY_COOKIE_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: navidrome
                    key: OAUTH2_PROXY_COOKIE_SECRET
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: [ALL]
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 128Mi
    service:
      app:
        controller: navidrome
        # keep the Service name the second service would otherwise suffix away
        forceRename: navidrome
        ports:
          http:
            port: *port
      oauth2-proxy:
        controller: oauth2-proxy
        ports:
          http:
            port: &oauth2port 4180
    route:
      app:
        hostnames:
          - "navidrome.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          # Subsonic API and public shares keep Navidrome's own token auth:
          # OIDC redirects would break mobile clients.
          - matches:
              - path:
                  type: PathPrefix
                  value: /rest
              - path:
                  type: PathPrefix
                  value: /share
            filters:
              - type: RequestHeaderModifier
                requestHeaderModifier:
                  remove: [X-Forwarded-Preferred-Username]
            backendRefs:
              - identifier: app
                port: *port
          - backendRefs:
              - identifier: oauth2-proxy
                port: *oauth2port
    persistence:
      config:
        existingClaim: navidrome-config
        globalMounts:
          - path: /config
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      cache:
        type: emptyDir
        globalMounts:
          - path: /config/cache
      backup:
        type: nfs
        server: ${REBOST_IP}
        path: ${REBOST_MEDIA_PATH}/Backups/navidrome
        globalMounts:
          - path: /backup
      collection:
        type: nfs
        server: ${REBOST_IP}
        path: ${REBOST_MEDIA_PATH}/Library/Media/Music/Collection
        globalMounts:
          - path: /collection
            readOnly: true
      mixtapes:
        type: nfs
        server: ${REBOST_IP}
        path: ${REBOST_MEDIA_PATH}/Library/Media/Music/Mixtapes
        globalMounts:
          - path: /mixtapes
            readOnly: true
      podcasts:
        type: nfs
        server: ${REBOST_IP}
        path: ${REBOST_MEDIA_PATH}/Library/Media/Podcasts
        globalMounts:
          - path: /podcasts
            readOnly: true
