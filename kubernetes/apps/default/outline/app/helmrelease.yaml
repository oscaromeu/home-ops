---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app outline
spec:
  chartRef:
    kind: OCIRepository
    name: outline
  values:
    controllers:
      outline:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/outlinewiki/outline
              tag: 1.10.1@sha256:832051f039b446c87aa23929cf92c00980c66aaa2d744d118c48c016ec816ad8
            envFrom:
              - secretRef:
                  name: outline-secret
            env:
              REDIS_URL: redis://valkey.databases.svc.cluster.local:6379/2
              URL: "https://docs.${SECRET_DOMAIN}"
              WEB_CONCURRENCY: "10"
              LOG_LEVEL: debug
              COLLABORATION_URL: https://docs.${SECRET_DOMAIN}
              FORCE_HTTPS: "true"
              COOKIE_SECURE: "true"
              PORT: "8080"
              FILE_STORAGE: s3
              FILE_STORAGE_UPLOAD_MAX_SIZE: "26214400"
              FILE_STORAGE_IMPORT_MAX_SIZE: "26214400"
              ENABLE_UPDATES: "false"
              AWS_REGION: us-east-1
              AWS_S3_ACL: private
              AWS_S3_FORCE_PATH_STYLE: "true"
              OIDC_ISSUER_URL: https://idm.${SECRET_DOMAIN}/oauth2/openid/outline
              OIDC_USERNAME_CLAIM: preferred_username
              OIDC_DISPLAY_NAME: kanidm
              OIDC_SCOPES: openid profile email groups
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: outline-postgres-credentials
                    key: uri
              INIT_POSTGRES_DBNAME:
                valueFrom:
                  secretKeyRef:
                    name: outline-postgres-credentials
                    key: INIT_POSTGRES_DBNAME
              INIT_POSTGRES_HOST:
                valueFrom:
                  secretKeyRef:
                    name: outline-postgres-credentials
                    key: INIT_POSTGRES_HOST
              INIT_POSTGRES_USER:
                valueFrom:
                  secretKeyRef:
                    name: outline-postgres-credentials
                    key: INIT_POSTGRES_USER
              INIT_POSTGRES_PASS:
                valueFrom:
                  secretKeyRef:
                    name: outline-postgres-credentials
                    key: INIT_POSTGRES_PASS
              INIT_POSTGRES_SUPER_PASS:
                valueFrom:
                  secretKeyRef:
                    name: outline-postgres-credentials
                    key: INIT_POSTGRES_SUPER_PASS
              OIDC_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: outline-kanidm-oauth2-credentials
                    key: CLIENT_ID
              OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: outline-kanidm-oauth2-credentials
                    key: CLIENT_SECRET
    service:
      app:
        ports:
          http:
            port: &port 8080
    route:
      app:
        hostnames: ["docs.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: *app
    resources:
      requests:
        cpu: 10m
        memory: 400Mi
      limits:
        memory: 2Gi
    persistence:
      data:
        enabled: false
        existingClaim: storage-data
        advancedMounts:
          outline:
            app:
              - path: /var/lib/outline
                subPath: data

