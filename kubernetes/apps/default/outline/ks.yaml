---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: outline
spec:
  dependsOn:
    - name: onepassword
      namespace: external-secrets
    - name: envoy-gateway
      namespace: network
    - name: crunchy-postgres-bootstrap
      namespace: databases
  postBuild:
    substitute:
      postgres_cluster_version: "v17-1"
  path: ./kubernetes/apps/default/outline/app
  targetNamespace: default
