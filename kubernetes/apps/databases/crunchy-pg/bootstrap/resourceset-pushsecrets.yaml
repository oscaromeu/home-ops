---
# yaml-language-server: $schema=https://raw.githubusercontent.com/controlplaneio-fluxcd/flux-operator/refs/heads/main/config/crd/bases/fluxcd.controlplane.io_resourcesets.yaml
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: postgres-app-pushsecrets
spec:
  # PushSecret has no per-app variation at all - every app pushes the same
  # 6 fields to the same 1Password item shape. Split out from
  # resourceset-secrets(-vikunja).yaml because it's the one piece every app
  # (including vikunja, whose ClusterExternalSecret shape is too different
  # to share inputs with the rest) can actually share without duplication.
  inputs:
    - app: test
    - app: test2
    - app: kguardian
    - app: atuin
    - app: grafana
    - app: linkding
    - app: vikunja
  resourcesTemplate: |
    apiVersion: external-secrets.io/v1alpha1
    kind: PushSecret
    metadata:
      name: postgres-${postgres_cluster_version}-pguser-<< inputs.app >>
      namespace: databases
    spec:
      data:
        - conversionStrategy: None
          match:
            remoteRef:
              property: dbname
              remoteKey: postgres-${postgres_cluster_version}-pguser-<< inputs.app >>
            secretKey: dbname
        - conversionStrategy: None
          match:
            remoteRef:
              property: host
              remoteKey: postgres-${postgres_cluster_version}-pguser-<< inputs.app >>
            secretKey: host
        - conversionStrategy: None
          match:
            remoteRef:
              property: password
              remoteKey: postgres-${postgres_cluster_version}-pguser-<< inputs.app >>
            secretKey: password
        - conversionStrategy: None
          match:
            remoteRef:
              property: port
              remoteKey: postgres-${postgres_cluster_version}-pguser-<< inputs.app >>
            secretKey: port
        - conversionStrategy: None
          match:
            remoteRef:
              property: user
              remoteKey: postgres-${postgres_cluster_version}-pguser-<< inputs.app >>
            secretKey: user
        - conversionStrategy: None
          match:
            remoteRef:
              property: uri
              remoteKey: postgres-${postgres_cluster_version}-pguser-<< inputs.app >>
            secretKey: uri
      deletionPolicy: Delete
      refreshInterval: 5m
      secretStoreRefs:
        - kind: ClusterSecretStore
          name: onepassword
      selector:
        secret:
          name: postgres-${postgres_cluster_version}-pguser-<< inputs.app >>
      template:
        data:
          dbname: '{{ index . "dbname" | toString }}'
          host: '{{ index . "host" | toString }}'
          password: '{{ index . "password" | toString }}'
          port: '{{ index . "port" | toString }}'
          uri: '{{ index . "uri" | toString }}'
          user: '{{ index . "user" | toString }}'
        engineVersion: v2
        mergePolicy: Replace
      updatePolicy: Replace
