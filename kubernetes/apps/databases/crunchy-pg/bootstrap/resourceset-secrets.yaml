---
# yaml-language-server: $schema=https://raw.githubusercontent.com/controlplaneio-fluxcd/flux-operator/refs/heads/main/config/crd/bases/fluxcd.controlplane.io_resourcesets.yaml
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: postgres-app-secrets
spec:
  inputs:
    - app: kguardian
      namespace: databases
    - app: outline
      needsInit: true
    - app: atuin
      needsInit: true
    - app: grafana
      namespace: observability
      needsInit: true
    - app: linkding
      needsInit: true
    - app: vikunja
      needsInit: true
  resourcesTemplate: |
    apiVersion: external-secrets.io/v1
    kind: ClusterExternalSecret
    metadata:
      name: << inputs.app >>-credentials-sync
    spec:
      externalSecretName: << inputs.app >>-credentials-sync-template
      namespaceSelectors:
        - matchLabels:
            kubernetes.io/metadata.name: << if index inputs "namespace" >><< inputs.namespace >><< else >>default<< end >>
      refreshTime: 1h
      externalSecretSpec:
        refreshInterval: 1h
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword
        target:
          name: << inputs.app >>-postgres-credentials
          creationPolicy: Owner
        data:
          - secretKey: dbname
            remoteRef:
              key: postgres-${postgres_cluster_version}-pguser-<< inputs.app >>
              property: dbname
          - secretKey: host
            remoteRef:
              key: postgres-${postgres_cluster_version}-pguser-<< inputs.app >>
              property: host
          - secretKey: port
            remoteRef:
              key: postgres-${postgres_cluster_version}-pguser-<< inputs.app >>
              property: port
          - secretKey: password
            remoteRef:
              key: postgres-${postgres_cluster_version}-pguser-<< inputs.app >>
              property: password
          - secretKey: user
            remoteRef:
              key: postgres-${postgres_cluster_version}-pguser-<< inputs.app >>
              property: user
          - secretKey: uri
            remoteRef:
              key: postgres-${postgres_cluster_version}-pguser-<< inputs.app >>
              property: uri
          <<- if index inputs "needsInit" >>
          - secretKey: INIT_POSTGRES_DBNAME
            remoteRef:
              key: postgres-${postgres_cluster_version}-pguser-<< inputs.app >>
              property: dbname
          - secretKey: INIT_POSTGRES_HOST
            remoteRef:
              key: postgres-${postgres_cluster_version}-pguser-<< inputs.app >>
              property: host
          - secretKey: INIT_POSTGRES_PASS
            remoteRef:
              key: postgres-${postgres_cluster_version}-pguser-<< inputs.app >>
              property: password
          - secretKey: INIT_POSTGRES_SUPER_PASS
            remoteRef:
              key: postgres-${postgres_cluster_version}-pguser-postgres
              property: password
          - secretKey: INIT_POSTGRES_USER
            remoteRef:
              key: postgres-${postgres_cluster_version}-pguser-<< inputs.app >>
              property: user
          <<- end >>
