---
# yaml-language-server: $schema=https://raw.githubusercontent.com/controlplaneio-fluxcd/flux-operator/refs/heads/main/config/crd/bases/fluxcd.controlplane.io_resourcesets.yaml
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: postgres-app-secrets
spec:
  inputs:
    - app: test
      namespace: databases
    - app: test2
      namespace: databases
    - app: kguardian
      namespace: databases
    - app: atuin
      namespace: default
      secretName: postgres-${postgres_cluster_version}-pguser-atuin
      fields:
        - key: ATUIN_DB_URI
          property: uri
        - key: INIT_POSTGRES_DBNAME
          property: dbname
        - key: INIT_POSTGRES_HOST
          property: host
        - key: INIT_POSTGRES_PASS
          property: password
        - key: INIT_POSTGRES_SUPER_PASS
          remoteKey: postgres-${postgres_cluster_version}-pguser-postgres
          property: password
        - key: INIT_POSTGRES_USER
          property: user
  resourcesTemplate: |
    apiVersion: external-secrets.io/v1alpha1
    kind: PushSecret
    metadata:
      name: postgres-${postgres_cluster_version}-pguser-<< inputs.app >>
      namespace: databases
    spec:
      data:
        - conversionStrategy: None
          match:
            remoteRef:
              property: dbname
              remoteKey: postgres-${postgres_cluster_version}-pguser-<< inputs.app >>
            secretKey: dbname
        - conversionStrategy: None
          match:
            remoteRef:
              property: host
              remoteKey: postgres-${postgres_cluster_version}-pguser-<< inputs.app >>
            secretKey: host
        - conversionStrategy: None
          match:
            remoteRef:
              property: password
              remoteKey: postgres-${postgres_cluster_version}-pguser-<< inputs.app >>
            secretKey: password
        - conversionStrategy: None
          match:
            remoteRef:
              property: port
              remoteKey: postgres-${postgres_cluster_version}-pguser-<< inputs.app >>
            secretKey: port
        - conversionStrategy: None
          match:
            remoteRef:
              property: user
              remoteKey: postgres-${postgres_cluster_version}-pguser-<< inputs.app >>
            secretKey: user
        - conversionStrategy: None
          match:
            remoteRef:
              property: uri
              remoteKey: postgres-${postgres_cluster_version}-pguser-<< inputs.app >>
            secretKey: uri
      deletionPolicy: Delete
      refreshInterval: 5m
      secretStoreRefs:
        - kind: ClusterSecretStore
          name: onepassword
      selector:
        secret:
          name: postgres-${postgres_cluster_version}-pguser-<< inputs.app >>
      template:
        data:
          dbname: '{{ index . "dbname" | toString }}'
          host: '{{ index . "host" | toString }}'
          password: '{{ index . "password" | toString }}'
          port: '{{ index . "port" | toString }}'
          uri: '{{ index . "uri" | toString }}'
          user: '{{ index . "user" | toString }}'
        engineVersion: v2
        mergePolicy: Replace
      updatePolicy: Replace
    ---
    apiVersion: external-secrets.io/v1
    kind: ClusterExternalSecret
    metadata:
      name: << inputs.app >>-credentials-sync
    spec:
      externalSecretName: << inputs.app >>-credentials-sync-template
      namespaceSelectors:
        - matchLabels:
            kubernetes.io/metadata.name: << inputs.namespace >>
      refreshTime: 1h
      externalSecretSpec:
        refreshInterval: 1h
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword
        target:
          <<- if index inputs "secretName" >>
          name: << inputs.secretName >>
          <<- else >>
          name: << inputs.app >>-postgres-credentials
          <<- end >>
          creationPolicy: Owner
        data:
          <<- if index inputs "fields" >>
          <<- range $f := inputs.fields >>
          - secretKey: << $f.key >>
            remoteRef:
              <<- if index $f "remoteKey" >>
              key: << $f.remoteKey >>
              <<- else >>
              key: postgres-${postgres_cluster_version}-pguser-<< inputs.app >>
              <<- end >>
              property: << $f.property >>
          <<- end >>
          <<- else >>
          - secretKey: password
            remoteRef:
              key: postgres-${postgres_cluster_version}-pguser-<< inputs.app >>
              property: password
          <<- end >>
