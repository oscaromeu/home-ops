---
# yaml-language-server: $schema=https://raw.githubusercontent.com/controlplaneio-fluxcd/flux-operator/refs/heads/main/config/crd/bases/fluxcd.controlplane.io_resourcesets.yaml
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: postgres-app-secrets
spec:
  inputs:
    - app: test
    - app: test2
  resources:
    - apiVersion: external-secrets.io/v1alpha1
      kind: PushSecret
      metadata:
        name: postgres-${postgres_cluster_version}-pguser-<< inputs.app >>
        namespace: databases
      spec:
        data:
          - conversionStrategy: None
            match:
              remoteRef:
                property: password
                remoteKey: postgres-${postgres_cluster_version}-pguser-<< inputs.app >>
              secretKey: password
        deletionPolicy: Delete
        refreshInterval: 5m
        secretStoreRefs:
          - kind: ClusterSecretStore
            name: onepassword
        selector:
          secret:
            name: postgres-${postgres_cluster_version}-pguser-<< inputs.app >>
        template:
          data:
            password: '{{ index . "password" | toString }}'
          engineVersion: v2
          mergePolicy: Replace
        updatePolicy: Replace
    - apiVersion: external-secrets.io/v1
      kind: ClusterExternalSecret
      metadata:
        name: postgres-${postgres_cluster_version}-pguser-<< inputs.app >>
      spec:
        externalSecretName: postgres-${postgres_cluster_version}-pguser-<< inputs.app >>-template
        namespaceSelectors:
          - matchLabels:
              kubernetes.io/metadata.name: databases
        refreshTime: 1h
        externalSecretSpec:
          refreshInterval: 1h
          secretStoreRef:
            kind: ClusterSecretStore
            name: onepassword
          target:
            name: << inputs.app >>-postgres-credentials
            creationPolicy: Owner
          data:
            - secretKey: password
              remoteRef:
                key: postgres-${postgres_cluster_version}-pguser-<< inputs.app >>
                property: password
