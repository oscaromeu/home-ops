---
# yaml-language-server: $schema=https://raw.githubusercontent.com/controlplaneio-fluxcd/flux-operator/refs/heads/main/config/crd/bases/fluxcd.controlplane.io_resourcesets.yaml
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: postgres-schema-grants
spec:
  inputs:
    - app: test
      database: test
    - app: test2
      database: test2
    - app: kguardian
      database: kguardian
  resources:
    - apiVersion: batch/v1
      kind: Job
      metadata:
        name: postgres-grant-<< inputs.app >>
        namespace: databases
      spec:
        backoffLimit: 3
        # No ttlSecondsAfterFinished: the flux-operator docs explicitly warn
        template:
          spec:
            restartPolicy: Never
            containers:
              - name: grant
                image: postgres:17-alpine
                env:
                  - name: PGHOST
                    valueFrom:
                      secretKeyRef:
                        name: postgres-v17-1-pguser-postgres
                        key: host
                  - name: PGPORT
                    valueFrom:
                      secretKeyRef:
                        name: postgres-v17-1-pguser-postgres
                        key: port
                  - name: PGUSER
                    valueFrom:
                      secretKeyRef:
                        name: postgres-v17-1-pguser-postgres
                        key: user
                  - name: PGPASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: postgres-v17-1-pguser-postgres
                        key: password
                command:
                  - psql
                  - -d
                  - << inputs.database >>
                  - -c
                  - GRANT ALL ON SCHEMA public TO << inputs.app >>;
