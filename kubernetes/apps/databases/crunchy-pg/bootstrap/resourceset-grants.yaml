---
# yaml-language-server: $schema=https://raw.githubusercontent.com/controlplaneio-fluxcd/flux-operator/refs/heads/main/config/crd/bases/fluxcd.controlplane.io_resourcesets.yaml
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: postgres-schema-grants
spec:
  inputs:
    - app: kguardian
      database: kguardian
    - app: outline
      database: outline
    - app: atuin
      database: atuin
    - app: grafana
      database: grafana
    - app: linkding
      database: linkding
    - app: vikunja
      database: vikunja
    - app: memos
      database: memos
  resources:
    - apiVersion: batch/v1
      kind: Job
      metadata:
        name: postgres-grant-<< inputs.app >>
        namespace: databases
        annotations:
          fluxcd.controlplane.io/force: enabled
      spec:
        backoffLimit: 3
        # No ttlSecondsAfterFinished: the flux-operator docs explicitly warn
        template:
          spec:
            restartPolicy: Never
            containers:
              - name: grant
                image: postgres:18-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
                env:
                  - name: PGHOST
                    valueFrom:
                      secretKeyRef:
                        name: postgres-v17-1-pguser-postgres
                        key: host
                  - name: PGPORT
                    valueFrom:
                      secretKeyRef:
                        name: postgres-v17-1-pguser-postgres
                        key: port
                  - name: PGUSER
                    valueFrom:
                      secretKeyRef:
                        name: postgres-v17-1-pguser-postgres
                        key: user
                  - name: PGPASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: postgres-v17-1-pguser-postgres
                        key: password
                command:
                  - psql
                  - -d
                  - << inputs.database >>
                  - -c
                  - GRANT ALL ON SCHEMA public TO << inputs.app >>;
