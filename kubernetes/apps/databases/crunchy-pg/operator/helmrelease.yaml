---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crunchy-postgres-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: pgo
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  #  dependsOn:
  #    - name: openebs
  #      namespace: openebs-system
  values:
    install:
      clusterLabels:
        app.kubernetes.io/name: pgo
    controllerImages:
      cluster: registry.developers.crunchydata.com/crunchydata/postgres-operator:ubi9-6.0.3-0@sha256:95a28ae077f0905b0516d73a33d22a86a44b2e817cc4f102ed9ec7c4bf9cd83b
