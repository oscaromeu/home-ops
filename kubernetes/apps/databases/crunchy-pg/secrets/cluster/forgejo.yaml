---
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: postgres-${postgres_cluster_version}-forgejo
spec:
  namespaceSelectors:
    - matchLabels:
        kubernetes.io/metadata.name: default
  externalSecretSpec:
    secretStoreRef:
      kind: ClusterSecretStore
      name: onepassword
    target:
      name: forgejo-db-secret
      creationPolicy: Owner
      template:
        data:
          # App, consumed as GITEA__DATABASE__* envs by the chart
          host: "{{ .host }}:{{ .port }}"
          dbname: "{{ .dbname }}"
          user: "{{ .user }}"
          password: "{{ .password }}"
          # Database init: postgres-init hands ownership of the database to
          # the app user, which crunchy does not do on its own
          INIT_POSTGRES_HOST: "{{ .host }}"
          INIT_POSTGRES_DBNAME: "{{ .dbname }}"
          INIT_POSTGRES_USER: "{{ .user }}"
          INIT_POSTGRES_PASS: "{{ .password }}"
          INIT_POSTGRES_SUPER_PASS: "{{ .superpass }}"
    data:
      - secretKey: host
        remoteRef:
          key: postgres-${postgres_cluster_version}-pguser-forgejo
          property: host
      - secretKey: port
        remoteRef:
          key: postgres-${postgres_cluster_version}-pguser-forgejo
          property: port
      - secretKey: dbname
        remoteRef:
          key: postgres-${postgres_cluster_version}-pguser-forgejo
          property: dbname
      - secretKey: user
        remoteRef:
          key: postgres-${postgres_cluster_version}-pguser-forgejo
          property: user
      - secretKey: password
        remoteRef:
          key: postgres-${postgres_cluster_version}-pguser-forgejo
          property: password
      - secretKey: superpass
        remoteRef:
          key: postgres-${postgres_cluster_version}-pguser-postgres
          property: password
