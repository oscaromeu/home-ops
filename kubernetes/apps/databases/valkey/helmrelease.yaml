---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/common-4.4.0/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app valkey
spec:
  chartRef:
    kind: OCIRepository
    name: valkey
  values:
    podSecurityContext:
      fsGroup: 1000
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
    resources: {}
    initResources: {}
    deploymentStrategy: RollingUpdate
    valkeyLogLevel: "notice"
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        interval: 30s
      prometheusRule:
        enabled: false
      exporter:
        image:
          tag: v1.99.0@sha256:2c0cdc2452096b5af460d870e72fa6ee2ebb971780f443a616885685d2c0ebad
          repository: oliver006/redis_exporter
    image:
      tag: 9.2.1@sha256:169567d6288e5f08aa141847c0c3e0864a32e727682ca6f052a20567c7103ef8
      repository: valkey/valkey
