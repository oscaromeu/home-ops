---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  valuesFrom:
    - kind: ConfigMap
      name: alertmanager-config
      valuesKey: values-alertmanager.yaml
    - kind: ConfigMap
      name: grafana-config
      valuesKey: values-grafana.yaml
    - kind: ConfigMap
      name: kube-apiserver-config
      valuesKey: values-kube-apiserver.yaml
    - kind: ConfigMap
      name: kube-controller-manager-config
      valuesKey: values-kube-controller-manager.yaml
    - kind: ConfigMap
      name: kube-etcd-config
      valuesKey: values-kube-etcd.yaml
    - kind: ConfigMap
      name: kube-proxy-config
      valuesKey: values-kube-proxy.yaml
    - kind: ConfigMap
      name: kube-scheduler-config
      valuesKey: values-kube-scheduler.yaml
    - kind: ConfigMap
      name: kube-state-metrics-config
      valuesKey: values-kube-state-metrics.yaml
    - kind: ConfigMap
      name: kubelet-config
      valuesKey: values-kubelet.yaml
    - kind: ConfigMap
      name: node-exporter-config
      valuesKey: values-node-exporter.yaml
    - kind: ConfigMap
      name: prometheus-node-exporter-config
      valuesKey: values-prometheus-node-exporter.yaml
    - kind: ConfigMap
      name: prometheus-config
      valuesKey: values-prometheus.yaml
  values:
    crds:
      enabled: true
    cleanPrometheusOperatorObjectNames: true
    defaultRules:
      additionalRuleGroupAnnotations:
        alertmanager: &alert_title
          alert_title: '{{ $labels.alertname }} — {{ or $labels.container $labels.pod $labels.node $labels.instance $labels.job $labels.service "cluster" }} · {{ or $labels.namespace "-" }} · {{ $labels.cluster }}/{{ $labels.env }}'
        configReloaders: *alert_title
        etcd: *alert_title
        general: *alert_title
        kubeApiserverSlos: *alert_title
        kubeControllerManager: *alert_title
        kubeProxy: *alert_title
        kubeSchedulerAlerting: *alert_title
        kubeStateMetrics: *alert_title
        kubernetesApps: *alert_title
        kubernetesResources: *alert_title
        kubernetesStorage: *alert_title
        kubernetesSystem: *alert_title
        network: *alert_title
        nodeExporterAlerting: *alert_title
        prometheus: *alert_title
        prometheusOperator: *alert_title
