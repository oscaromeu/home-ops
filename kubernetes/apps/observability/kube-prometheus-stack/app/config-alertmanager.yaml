---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/alertmanagerconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager
spec:
  route:
    receiver: blackhole
    repeatInterval: 12h
    routes:
      - receiver: blackhole
        matchers:
          - name: alertname
            value: InfoInhibitor
            matchType: =
      - receiver: allquiet
        continue: true
        matchers:
          - name: alertgroup
            value: Discogs
            matchType: "!="
          - name: severity
            value: info|warning|critical
            matchType: =~
      - receiver: ch-archive
        continue: true
        repeatInterval: 365d
      - receiver: pushover-discogs
        matchers:
          - name: alertgroup
            value: Discogs
            matchType: =
      - receiver: pushover
        matchers:
          - name: severity
            value: critical
            matchType: =
    # "..." disables grouping: one notification per alert.
    groupBy:
      - "..."
    groupInterval: 5m
    groupWait: 30s

  inhibitRules:
    - equal:
        - alertname
        - namespace
      sourceMatch:
        - name: severity
          value: critical
          matchType: =
      targetMatch:
        - name: severity
          value: warning
          matchType: =

  receivers:
    - name: blackhole
    # PoC CORE-1841: opens incidents in the AllQuiet sandbox team.
    - name: allquiet
      webhookConfigs:
        - urlSecret:
            name: alertmanager-secret
            key: ALLQUIET_WEBHOOK_URL
          sendResolved: true
    # Long-term alert history in ClickHouse (observability.alert_events).
    - name: ch-archive
      webhookConfigs:
        - url: http://fluent-bit-aggregator.observability.svc.cluster.local:8888/
          sendResolved: true
    - name: pushover-discogs
      pushoverConfigs:
        - html: true
          message: |-
            {{- range .Alerts }}
              {{ .Annotations.description }}
            {{- end }}
          priority: |-
            {{ if eq .Status "firing" }}1{{ else }}0{{ end }}
          sendResolved: true
          sound: cashregister
          title: >-
            [{{ .Status | toUpper }}] Discogs: {{ .CommonLabels.title }}
          token:
            name: alertmanager-secret
            key: ALERTMANAGER_PUSHOVER_TOKEN
          userKey:
            name: alertmanager-secret
            key: PUSHOVER_USER_KEY
          url: https://www.discogs.com/release/{{ .CommonLabels.release_id }}
          urlTitle: Open on Discogs
    - name: pushover
      pushoverConfigs:
        - html: true
          message: |-
            {{- range .Alerts }}
              {{- if ne .Annotations.description "" }}
                {{ .Annotations.description }}
              {{- else if ne .Annotations.summary "" }}
                {{ .Annotations.summary }}
              {{- else if ne .Annotations.message "" }}
                {{ .Annotations.message }}
              {{- else }}
                Alert description not available
              {{- end }}
              {{- if gt (len .Labels.SortedPairs) 0 }}
                <small>
                  {{- range .Labels.SortedPairs }}
                    <b>{{ .Name }}:</b> {{ .Value }}
                  {{- end }}
                </small>
              {{- end }}
            {{- end }}
          priority: |-
            {{ if eq .Status "firing" }}1{{ else }}0{{ end }}
          sendResolved: true
          sound: gamelan
          title: >-
            [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}
          token:
            name: alertmanager-secret
            key: ALERTMANAGER_PUSHOVER_TOKEN
          userKey:
            name: alertmanager-secret
            key: PUSHOVER_USER_KEY
          url: https://alertmanager.${SECRET_DOMAIN}
          urlTitle: View in Alertmanager