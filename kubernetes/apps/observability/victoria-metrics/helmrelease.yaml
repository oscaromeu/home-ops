---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-metrics
  valuesFrom:
    - kind: ConfigMap
      name: kube-state-metrics-config
      valuesKey: values-kube-state-metrics.yaml
  values:
    fullnameOverride: victoria-metrics
    vmsingle:
      enabled: true
      spec:
        retentionPeriod: 14d
        storage:
          storageClassName: ${STORAGE_CLASS}
          resources:
            requests:
              storage: 20Gi
    # OTel collector does the scraping
    vmagent:
      enabled: false
    vmalert:
      enabled: true
    alertmanager:
      enabled: true
      spec:
        # The converted AlertmanagerConfig is the whole routing tree, not per-namespace
        disableNamespaceMatcher: true
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: ${STORAGE_CLASS}
              resources:
                requests:
                  storage: 1Gi
    grafana:
      enabled: false
    defaultDashboards:
      enabled: false
    defaultRules:
      enabled: true
    # The chart wires these for vmagent (off); the TA reads ServiceMonitors
    kube-state-metrics:
      enabled: true
      fullnameOverride: kube-state-metrics
      prometheus:
        monitor:
          enabled: true
          honorLabels: true
      image:
        tag: v2.20.0@sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
        repository: kube-state-metrics/kube-state-metrics
    prometheus-node-exporter:
      enabled: true
      fullnameOverride: node-exporter
      prometheus:
        monitor:
          enabled: true
          jobLabel: node-exporter
      image:
        # renovate: image=quay.io/prometheus/node-exporter
        tag: v1.12.1
        digest: sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    kubelet:
      enabled: false
    kubeApiServer:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false
    coreDns:
      enabled: false
    victoria-metrics-operator:
      image:
        tag: v0.75.2@sha256:237fac68b608c7ed7bc4c47ad25ebcb1cbe973c9a789661d2b6cfaa83093f87a
        repository: victoriametrics/operator
      crds:
        cleanup:
          image:
            tag: v1.37.2@sha256:fe049faa65ae483ac200009a949a68fa4c9985daea12c9cb1195c9c7965301fc
            repository: registry.k8s.io/kubectl
    syncJob:
      image:
        tag: v0.0.18@sha256:1fdd38d82e100429b138d8500425773d6d319a35a53478a66ee20dff392e6117
        repository: ghcr.io/victoriametrics/sync-job
