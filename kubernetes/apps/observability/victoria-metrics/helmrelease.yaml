---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-metrics
  valuesFrom:
    - kind: ConfigMap
      name: kube-state-metrics-config
      valuesKey: values-kube-state-metrics.yaml
  values:
    fullnameOverride: victoria-metrics
    vmsingle:
      enabled: true
      spec:
        retentionPeriod: 14d
        storage:
          storageClassName: ${STORAGE_CLASS}
          resources:
            requests:
              storage: 20Gi
    # OTel collector does the scraping
    vmagent:
      enabled: false
    vmalert:
      enabled: true
    alertmanager:
      enabled: true
      spec:
        # The converted AlertmanagerConfig is the whole routing tree, not per-namespace
        disableNamespaceMatcher: true
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: ${STORAGE_CLASS}
              resources:
                requests:
                  storage: 1Gi
    grafana:
      enabled: false
    defaultDashboards:
      enabled: false
    defaultRules:
      enabled: true
    # The chart wires these for vmagent (off); the TA reads ServiceMonitors
    kube-state-metrics:
      enabled: true
      fullnameOverride: kube-state-metrics
      prometheus:
        monitor:
          enabled: true
          honorLabels: true
    prometheus-node-exporter:
      enabled: true
      fullnameOverride: node-exporter
      prometheus:
        monitor:
          enabled: true
          jobLabel: node-exporter
    kubelet:
      enabled: false
    kubeApiServer:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false
    coreDns:
      enabled: false
