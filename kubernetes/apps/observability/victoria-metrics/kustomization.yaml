---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./config-alertmanager.yaml
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./httproute.yaml
  - ./ocirepository.yaml
  - ./prometheusrule-e2e.yaml
  - ./prometheusrule-postgres.yaml
configMapGenerator:
  - name: kube-state-metrics-config
    files:
      - values-kube-state-metrics.yaml
generatorOptions:
  disableNameSuffixHash: true
configurations:
  - kustomizeconfig.yaml
