---
apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: discogs-watchlist
spec:
  parallelism: 1
  runner:
    image: grafana/k6:2.3.0-with-browser@sha256:8663335c8c1c5a40dd51823ef980c584761a4a084a2297fca29a29ee495c6bc1
    resources:
      requests:
        cpu: "100m"
      limits:
        memory: "256Mi"
    env:
      - name: K6_PROMETHEUS_RW_SERVER_URL
        value: http://vmsingle-victoria-metrics.observability.svc.cluster.local:8428/api/v1/write
    envFrom:
      - secretRef:
          name: discogs-watchlist-secret
  arguments: -o experimental-prometheus-rw --quiet --summary-mode disabled
  script:
    configMap:
      name: discogs-watchlist
      file: discogs-watchlist.js
