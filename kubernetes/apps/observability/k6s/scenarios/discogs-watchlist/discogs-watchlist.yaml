---
apiVersion: k6.io/v1alpha1
kind: TestRun
metadata:
  name: discogs-watchlist
spec:
  parallelism: 1
  runner:
    image: grafana/k6:2.4.0-with-browser@sha256:61192a56b64554ed96ef4c657cd936af5847a9335457299cf6d2d04122bb493a
    resources:
      requests:
        cpu: "100m"
      limits:
        memory: "256Mi"
    env:
      - name: K6_PROMETHEUS_RW_SERVER_URL
        value: http://vmsingle-victoria-metrics.observability.svc.cluster.local:8428/api/v1/write
    envFrom:
      - secretRef:
          name: discogs-watchlist-secret
  arguments: -o experimental-prometheus-rw --quiet --summary-mode disabled
  script:
    configMap:
      name: discogs-watchlist
      file: discogs-watchlist.js
