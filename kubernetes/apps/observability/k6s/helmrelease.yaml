---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k6-operator
  namespace: observability
spec:
  chart:
    spec:
      chart: k6-operator
      version: '4.2.0'
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: k6
  values:
    installCRDs: true
    namespace:
      create: false
    metrics:
      serviceMonitor:
        enabled: false
        interval: "1m"
    service:
      enabled: false
    manager:
      replicas: 1
      serviceAccount:
        name: k6-operator-controller
        create: true
      resources:
        limits:
          memory: 100Mi
        requests:
          cpu: 100m
          memory: 50Mi
      image:
        tag: controller-v1.2.0@sha256:4e08d89dee3419f68ed6c4716ab8843d6602d64675e298d05e62acbb40bd9645
        repository: grafana/k6-operator
