---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/opentelemetry.io/opentelemetrycollector_v1beta1.json
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-agent
spec:
  mode: daemonset
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  volumes:
    - name: varlogpods
      hostPath:
        path: /var/log/pods
  volumeMounts:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      filelog:
        include: [/var/log/pods/*/*/*.log]
        exclude: [/var/log/pods/observability_otel-agent*/*/*.log]
        start_at: end
        include_file_path: true
        operators:
          - type: container
    processors:
      resource/cluster-insert:
        attributes:
          - key: cluster
            value: ${CLUSTER_NAME}
            action: insert
      resource/cluster:
        attributes:
          - key: cluster
            value: ${CLUSTER_NAME}
            action: upsert
      k8sattributes:
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.container.name
            - k8s.node.name
        labels:
          - tag_name: pod.label.app-name
            key: app.kubernetes.io/name
            from: pod
          - tag_name: pod.label.app
            key: app
            from: pod
          - tag_name: pod.label.k8s-app
            key: k8s-app
            from: pod
          - tag_name: pod.label.name
            key: name
            from: pod
          - tag_name: pod.label.application
            key: application
            from: pod
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.uid
      transform/log-fields:
        error_mode: ignore
        log_statements:
          - context: resource
            statements:
              - set(attributes["app"], attributes["pod.label.app-name"])
              - set(attributes["app"], attributes["pod.label.app"]) where attributes["app"] == nil
              - set(attributes["app"], attributes["pod.label.k8s-app"]) where attributes["app"] == nil
              - set(attributes["app"], attributes["pod.label.name"]) where attributes["app"] == nil
              - set(attributes["app"], attributes["pod.label.application"]) where attributes["app"] == nil
              - set(attributes["k_namespace_name"], attributes["k8s.namespace.name"])
              - set(attributes["k_pod_name"], attributes["k8s.pod.name"])
              - set(attributes["k_container_name"], attributes["k8s.container.name"])
              - set(attributes["k_node_name"], attributes["k8s.node.name"])
              - delete_matching_keys(attributes, "^(k8s\\.|pod\\.label\\.)")
          - context: log
            statements:
              - set(attributes["stream"], attributes["log.iostream"])
              - delete_key(attributes, "log.iostream")
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch: {}
    exporters:
      otlphttp:
        endpoint: https://otel.${SECRET_DOMAIN}
    service:
      pipelines:
        logs:
          receivers: [filelog]
          processors: [memory_limiter, k8sattributes, resource/cluster, transform/log-fields, batch]
          exporters: [otlphttp]
        logs/otlp:
          receivers: [otlp]
          processors: [memory_limiter, resource/cluster-insert, batch]
          exporters: [otlphttp]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, resource/cluster-insert, batch]
          exporters: [otlphttp]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource/cluster-insert, batch]
          exporters: [otlphttp]
