---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: krr
spec:
  schedule: "0 6 * * 1"
  timeZone: "${TZ}"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        spec:
          serviceAccountName: krr
          restartPolicy: OnFailure
          initContainers:
            - name: scan
              image: docker.io/robustadev/krr:v1.31.0@sha256:ce666bf65215ec3cbe4366df5e935ffb0c10a9aaaccaeeb879e289a0f4d67da1
              command: ["python", "krr.py", "simple"]
              args:
                - --quiet
                - --logtostderr
                - --prometheus-url=http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
                - --formatter=json
                - --fileoutput=/share/krr.json
                - --history_duration=168
                - --resource=Deployment
                - --resource=StatefulSet
                - --resource=DaemonSet
                - --resource=CronJob
              env:
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: share
                  mountPath: /share
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
          containers:
            - name: ingest
              image: docker.io/clickhouse/clickhouse-server:26.9@sha256:387ebbcca253026def04dc79e83d2323ac7d97bf309ddd090a8a3c702573e01a
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  ch() { clickhouse-client --host=clickhouse-clickhouse-headless.databases.svc.cluster.local --port=9000 --user=default "$@"; }
                  ch --multiquery --queries-file=/schema/schema.sql
                  ch --query="INSERT INTO observability.krr_raw (payload) FORMAT JSONAsString" < /share/krr.json
              volumeMounts:
                - name: share
                  mountPath: /share
                  readOnly: true
                - name: schema
                  mountPath: /schema
                  readOnly: true
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            fsGroup: 101
          volumes:
            - name: share
              emptyDir: {}
            - name: tmp
              emptyDir: {}
            - name: schema
              configMap:
                name: krr-schema
