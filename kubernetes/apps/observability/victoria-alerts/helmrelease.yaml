---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-alerts
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-alerts
  values:
    nameOverride: "victoria-alerts"
    server:
      annotations:
        reloader.stakater.com/auto: "true"
      replicaCount: 1
      datasource:
        url: "http://victoria-logs-server.observability.svc.cluster.local:9428"
      remote:
        write:
          url: "http://vmsingle-victoria-metrics.observability.svc.cluster.local:8428"
        read:
          url: "http://vmsingle-victoria-metrics.observability.svc.cluster.local:8428"
      notifier:
        alertmanager:
          url: "http://vmalertmanager-victoria-metrics.observability.svc.cluster.local:9093"
      securityContext:
        enabled: true
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
      configMap: "victoria-alerts-server-alert-rules-config"
      resources: {}
      # limits:
      #   cpu: 100m
      #   memory: 128Mi
      # requests:
      #   cpu: 100m
      #   memory: 128Mi

      image:
        tag: v1.157.0@sha256:c550cfc345a1f3e130a3c78b3f5a910122448c66b3008d9a29eaa0559e9a23dd
        repository: victoriametrics/vmalert
    serviceMonitor:
      enabled: true
