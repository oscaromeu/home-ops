apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-collector-daemonset
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  selector:
    matchLabels:
      name: otel-collector
  template:
    metadata:
      labels:
        name: otel-collector
        app: otel-collector
    spec:
      containers:
        - name: otelcol
          image: otel/opentelemetry-collector-contrib:0.159.0@sha256:1f2c54a30e713fac6b3ae77a1ec84010c2007e29ced8ec666214fc2f6739c1cc
          args:
            - --config=/conf/collector.yaml
          ports:
            - containerPort: 4317
              name: otlp
              protocol: TCP
            - containerPort: 8888
              name: metrics
              protocol: TCP
          volumeMounts:
            - mountPath: /conf
              name: otel-collector-config-volume
      volumes:
        - name: otel-collector-config-volume
          configMap:
            name: otel-collector-config
            items:
              - key: collector.yaml
                path: collector.yaml

---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    name: otel-collector
    app: otel-collector
spec:
  selector:
    name: otel-collector
  ports:
    - port: 4317
      protocol: TCP
      name: tcp
      targetPort: 4317
    - port: 8888
      protocol: TCP
      name: metrics
      targetPort: 8888