---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/opentelemetry.io/opentelemetrycollector_v1beta1.json
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-scraper
spec:
  mode: statefulset
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 768Mi
  targetAllocator:
    enabled: true
    serviceAccount: otel-scraper-targetallocator
    prometheusCR:
      enabled: true
      serviceMonitorSelector: {}
      podMonitorSelector: {}
  config:
    receivers:
      prometheus:
        config:
          global:
            scrape_interval: 1m
          # kubelet has no Service anyone maintains; role node tracks the nodes itself
          scrape_configs:
            - job_name: kubelet
              scheme: https
              kubernetes_sd_configs: [{role: node}]
              authorization:
                credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              tls_config:
                insecure_skip_verify: true
              honor_labels: true
              relabel_configs:
                - source_labels: [__meta_kubernetes_node_name]
                  target_label: node
                - target_label: metrics_path
                  replacement: /metrics
            - job_name: kubelet-cadvisor
              scheme: https
              metrics_path: /metrics/cadvisor
              kubernetes_sd_configs: [{role: node}]
              authorization:
                credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              tls_config:
                insecure_skip_verify: true
              honor_labels: true
              relabel_configs:
                - source_labels: [__meta_kubernetes_node_name]
                  target_label: node
                - target_label: metrics_path
                  replacement: /metrics/cadvisor
                - target_label: job
                  replacement: kubelet
    processors:
      attributes/cluster:
        actions:
          - key: cluster
            value: ${CLUSTER_NAME}
            action: upsert
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch: {}
    exporters:
      otlp:
        endpoint: otel-gateway-collector.observability.svc.cluster.local:4317
        tls:
          insecure: true
    service:
      pipelines:
        metrics:
          receivers: [prometheus]
          processors: [memory_limiter, attributes/cluster, batch]
          exporters: [otlp]
