---
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: grafana
spec:
  kanidmRef:
    name: kanidm
    namespace: security
  displayname: Grafana
  origin: https://grafana.${SECRET_DOMAIN}/
  redirectUrl:
    - https://grafana.${SECRET_DOMAIN}/login/generic_oauth
  scopeMap:
    - group: admins@idm.${SECRET_DOMAIN}
      scopes:
        - openid
        - profile
        - email
        - groups
  claimMap:
    - name: grafana_role
      valuesMap:
        - group: admins@idm.${SECRET_DOMAIN}
          values:
            - admins
      joinStrategy: array
  strictRedirectUrl: true
  disableConsentPrompt: true
