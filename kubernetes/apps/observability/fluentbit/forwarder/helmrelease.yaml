---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-bit-forwarder
spec:
  chartRef:
    kind: OCIRepository
    name: fluent-bit
  values:
    annotations:
      reloader.stakater.com/auto: "true"
    existingConfigMap: fluentbit
    image:
      repository: cr.fluentbit.io/fluent/fluent-bit
      tag: 5.1.3-debug@sha256:5c7b210ba86ab7625a32128dbc5b2fca78a4ea636762b2e6278f04766d0d4544
    args:
      - --workdir=/fluent-bit/etc
      - --config=/fluent-bit/etc/conf/fluentbit.yaml
    dashboards:
      enabled: true
    serviceMonitor:
      enabled: true
    logLevel: warn
    priorityClassName: system-node-critical
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
    extraVolumes:
      - name: parsers
        configMap:
          defaultMode: 420
          name: parsers
      - name: pipelines-forwarder
        configMap:
          defaultMode: 420
          name: pipelines-forwarder
    extraVolumeMounts:
      - name: parsers
        mountPath: /fluent-bit/etc/conf/parsers.d/
      - name: pipelines-forwarder
        mountPath: /fluent-bit/etc/conf/pipelines.d/
