---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-traces
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-traces
  values:
    fullnameOverride: victoria-traces
    server:
      replicaCount: 1
      persistentVolume:
        enabled: true
        storageClassName: ${STORAGE_CLASS}
        size: 10Gi
      retentionPeriod: 7d
      extraArgs:
        envflag.enable: true
        envflag.prefix: VM_
        loggerFormat: json
        http.shutdownDelay: 15s
      route:
        enabled: true
        hostnames:
          - victoria-traces.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
      serviceMonitor:
        enabled: true
        interval: 15s
      image:
        tag: v0.13.0@sha256:3018df8f99429d7d3029167ab9f70848bf0a778c31c49dff16c86c7e34759fbd
        repository: victoriametrics/victoria-traces
