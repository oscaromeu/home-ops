---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-snapshot
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-snapshot
spec:
  schedule: "0 3 * * *"
  timeZone: "${TZ}"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        spec:
          serviceAccountName: openbao-snapshot
          restartPolicy: OnFailure
          initContainers:
            - name: snapshot
              image: quay.io/openbao/openbao:2.7.0@sha256:71156a1c6623a5fa3f5e61b0c6a8ead0faf0df29a778339188443551995d1315
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  export BAO_TOKEN="$(bao write -field=token auth/kubernetes/login role=openbao-snapshot jwt=@/var/run/secrets/kubernetes.io/serviceaccount/token)"
                  bao operator raft snapshot save "/share/openbao-$(date +%Y%m%d-%H%M%S).snap"
              env:
                - name: BAO_ADDR
                  value: http://openbao-active.security.svc.cluster.local:8200
              volumeMounts:
                - name: share
                  mountPath: /share
          containers:
            - name: upload
              image: rclone/rclone:1.75.1@sha256:45401ad7410db1d67ffdb58e19059ad20b0d8e0285a60e38bbec55cc1019c7a5
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  rclone copy /share garage:openbao-snapshots/
                  rclone delete garage:openbao-snapshots/ --min-age 30d
              env:
                - name: RCLONE_CONFIG_GARAGE_TYPE
                  value: s3
                - name: RCLONE_CONFIG_GARAGE_PROVIDER
                  value: Other
                - name: RCLONE_CONFIG_GARAGE_ENDPOINT
                  value: http://garage.storage.svc.cluster.local:3900
                - name: RCLONE_CONFIG_GARAGE_REGION
                  value: us-east-1
              envFrom:
                - secretRef:
                    name: openbao-snapshot-s3
              volumeMounts:
                - name: share
                  mountPath: /share
          volumes:
            - name: share
              emptyDir: {}
