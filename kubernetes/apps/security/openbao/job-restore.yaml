---
apiVersion: batch/v1
kind: Job
metadata:
  name: openbao-restore
spec:
  suspend: true
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: download
          image: rclone/rclone:1.76.0@sha256:7cbeec24a44f206067597c0368be4de90ae19a64d5113c7d1938bd737a81e466
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              latest="$(rclone lsf garage:openbao-snapshots/ --files-only | sort | tail -n1)"
              rclone copyto "garage:openbao-snapshots/${latest}" /share/restore.snap
          env:
            - name: RCLONE_CONFIG_GARAGE_TYPE
              value: s3
            - name: RCLONE_CONFIG_GARAGE_PROVIDER
              value: Other
            - name: RCLONE_CONFIG_GARAGE_ENDPOINT
              value: http://garage.storage.svc.cluster.local:3900
            - name: RCLONE_CONFIG_GARAGE_REGION
              value: us-east-1
          envFrom:
            - secretRef:
                name: openbao-snapshot-s3
          volumeMounts:
            - name: share
              mountPath: /share
      containers:
        - name: restore
          image: quay.io/openbao/openbao:2.7.3@sha256:ba4b133eb9586630024e71a617e66f37f29cc3534cdd46a6233e098ceded8dc9
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              bao operator raft snapshot restore -force /share/restore.snap
          env:
            - name: BAO_ADDR
              value: http://openbao-active.security.svc.cluster.local:8200
            - name: BAO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openbao-restore-token
                  key: token
          volumeMounts:
            - name: share
              mountPath: /share
      volumes:
        - name: share
          emptyDir: {}
