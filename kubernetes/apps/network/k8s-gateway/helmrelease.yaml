---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
spec:
  chartRef:
    kind: OCIRepository
    name: k8s-gateway
  values:
    serviceType: LoadBalancer
    service:
      annotations:
        lbipam.cilium.io/ips: "${K8S_GATEWAY_LB}"
      externalTrafficPolicy: Cluster
    servers:
      - zones:
          - zone: .
            use_tcp: true
        port: 53
        plugins:
          - name: log
          - name: errors
          - name: health
            configBlock: |-
              lameduck 5s
          - name: ready
          - name: k8s_gateway
            parameters: "${SECRET_DOMAIN}"
            configBlock: |-
              apex k8s-gateway.network
              ttl 1
              resources HTTPRoute Service
              fallthrough
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: forward
            parameters: . 1.1.1.1 1.0.0.1
          - name: loop
          - name: reload
          - name: loadbalance
    image:
      tag: 1.9.2@sha256:80930fdbf98f28d4d5009cc4da8ddedbaa8afc9a6b753419e54d4cd30cea7308
      repository: codeberg.org/k8s-gateway/k8s_gateway
