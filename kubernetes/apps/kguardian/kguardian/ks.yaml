---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kguardian
spec:
  dependsOn:
    - name: crunchy-postgres-bootstrap
      namespace: databases
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kguardian
      namespace: kguardian
  interval: 1h
  path: "./kubernetes/apps/kguardian/kguardian/app"
  postBuild:
    substitute:
      postgres_cluster_version: "v17-1"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: kguardian
