---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kanidm-instance
  namespace: flux-system
spec:
  targetNamespace: security
  path: ./kubernetes/apps/security/kanidm-operator/instance
  dependsOn:
    - name: kanidm-operator
  healthChecks:
    - apiVersion: kaniop.rs/v1beta1
      kind: Kanidm
      name: kanidm
      namespace: security
  healthCheckExprs:
    - apiVersion: kaniop.rs/v1beta1
      kind: Kanidm
      failed: status.conditions.exists(c, c.type == 'Available' && c.status == 'False')
      current: status.conditions.exists(c, c.type == 'Available' && c.status == 'True')
