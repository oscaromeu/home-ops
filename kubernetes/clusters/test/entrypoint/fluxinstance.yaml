---
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  cluster:
    domain: cluster.local
    multitenant: false
    networkPolicy: false
    tenantDefaultServiceAccount: default
    type: kubernetes
  commonMetadata:
    labels:
      app.kubernetes.io/name: flux
  components:
  - source-controller
  - kustomize-controller
  - helm-controller
  - notification-controller
  distribution:
    artifact: oci://ghcr.io/controlplaneio-fluxcd/flux-operator-manifests:v0.61.0
    registry: ghcr.io/fluxcd
    version: 2.x
  kustomize:
    patches:
    - patch: |
        - op: add
          path: /spec/template/spec/containers/0/args/-
          value: --sops-age-secret=sops-age
      target:
        kind: Deployment
        name: kustomize-controller
  sync:
    interval: 1m
    kind: GitRepository
    path: kubernetes/clusters/test/entrypoint
    ref: refs/heads/main
    url: https://github.com/oscaromeu/home-ops.git
