---
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: not-used
spec:
  resourcesTemplate: |
    ---
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: << inputs.app >>
      namespace: flux-system
    spec:
      interval: 1h
      prune: true
      deletionPolicy: WaitForTermination
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      path: << dig "path" (printf "./kubernetes/apps/%s/%s/app" (dig "namespace" "default" inputs) inputs.app) inputs >>
      targetNamespace: << dig "targetNamespace" (dig "namespace" "default" inputs) inputs >>
      decryption:
        provider: sops
      <<- if hasKey inputs "dependsOn" >>
      dependsOn: << toYaml inputs.dependsOn | nindent 8 >>
      <<- end >>
      <<- if hasKey inputs "healthChecks" >>
      healthChecks: << toYaml inputs.healthChecks | nindent 8 >>
      <<- end >>
      <<- if hasKey inputs "healthCheckExprs" >>
      healthCheckExprs: << toYaml inputs.healthCheckExprs | nindent 8 >>
      <<- end >>
      <<- if hasKey inputs "commonMetadata" >>
      commonMetadata: << toYaml inputs.commonMetadata | nindent 8 >>
      <<- end >>
      <<- if hasKey inputs "wait" >>
      wait: << inputs.wait >>
      <<- end >>
      <<- if hasKey inputs "force" >>
      force: << inputs.force >>
      <<- end >>
      postBuild:
        substituteFrom:
          - kind: Secret
            name: cluster-secrets
        <<- if hasKey inputs "substitute" >>
        substitute: << toYaml inputs.substitute | nindent 10 >>
        <<- end >>
      patches:
        <<- if hasKey inputs "patches" >><< toYaml inputs.patches | nindent 8 >><< end >>
        - patch: |-
            apiVersion: helm.toolkit.fluxcd.io/v2
            kind: HelmRelease
            metadata:
              name: _
            spec:
              interval: 1h
              install:
                crds: CreateReplace
                strategy:
                  name: RetryOnFailure
              rollback:
                cleanupOnFail: true
                recreate: true
              upgrade:
                cleanupOnFail: true
                crds: CreateReplace
                strategy:
                  name: RemediateOnFailure
                remediation:
                  remediateLastFailure: true
                  retries: 2
          target:
            group: helm.toolkit.fluxcd.io
            kind: HelmRelease
