---
name: "Flate"

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-job:
    name: Flate Pre-Job
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: kubernetes/**

  test:
    name: Flate Test
    needs: pre-job
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    if: ${{ needs.pre-job.outputs.any_changed == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: "aqua:cue-lang/cue"
          cache: true

      - name: Setup flate
        uses: home-operations/flate/action@4e07f351352d235a335e5a1f0a088eab7ec40997 # v0.8.0
        with:
          cache: "true"
          base: ""

      - name: Generate flate supply
        run: ./scripts/flate-supply.sh > supply.yaml

      - name: Run flate test
        id: test
        continue-on-error: true
        shell: bash
        env:
          FLATE_SUPPLY: supply.yaml
          FLATE_STRICT_SUBSTITUTIONS: "true"
        run: flate test all --path kubernetes/clusters/home/entrypoint 2>&1 | tee test.log

      - name: Generate Report
        if: steps.test.outcome == 'failure'
        shell: bash
        run: |
          detail=$(grep -vE "'oneOf' failed|missing propert|value must be|: validation failed" test.log \
            | awk '/✗/{p=1; delete seen; print; next}
                   p && /^[[:space:]]{5,}/{if (!seen[$0]++) print; next}
                   {p=0}' | head -80)
          {
            echo "### Flate test failed"
            echo
            echo "These resources do not render against this branch."
            echo
            echo '```'
            if [[ -n "$detail" ]]; then printf '%s\n' "$detail"; else tail -20 test.log; fi
            echo '```'
          } > test-report.md
          cat test-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Add Comment
        if: steps.test.outcome == 'failure'
        continue-on-error: true
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12
        with:
          message-id: "${{ github.event.pull_request.number }}/kubernetes/flate-test"
          message-failure: Flate test was not successful
          message-path: test-report.md

      - name: Verdict
        if: steps.test.outcome == 'failure'
        run: exit 1

  diff:
    name: Flate Diff
    needs: pre-job
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    if: ${{ needs.pre-job.outputs.any_changed == 'true' }}
    steps:
      - name: Checkout Pull Request Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pull

      - name: Checkout Default Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ github.event.repository.default_branch }}"
          path: default

      - name: Setup mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          working_directory: pull
          install_args: "aqua:cue-lang/cue"
          cache: true

      - name: Setup flate
        uses: home-operations/flate/action@4e07f351352d235a335e5a1f0a088eab7ec40997 # v0.8.0
        with:
          cache: "true"
          base: ""

      - name: Generate flate supply
        run: ./pull/scripts/flate-supply.sh > supply.yaml

      - name: Run flate diff
        env:
          FLATE_SUPPLY: supply.yaml
        run: >-
          flate diff all
          --path pull/kubernetes/clusters/home/entrypoint
          --path-orig default/kubernetes/clusters/home/entrypoint
          -o github > diff.md

      - name: Generate Diff
        id: diff
        run: |
          cat diff.md
          {
              echo 'diff<<EOF'
              cat diff.md
              echo EOF
          } >> "$GITHUB_OUTPUT"
          {
              echo "### Diff"
              echo '```diff'
              cat diff.md
              echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Add Comment
        if: ${{ steps.diff.outputs.diff != '' }}
        continue-on-error: true
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12
        with:
          message-id: "${{ github.event.pull_request.number }}/kubernetes/flate"
          message-failure: Diff was not successful
          message: |
            ```diff
            ${{ steps.diff.outputs.diff }}
            ```

  flate-status:
    name: Flate Success
    needs: ["test", "diff"]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
