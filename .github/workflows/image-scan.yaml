---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Image Scan

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-job:
    name: Image Scan Pre-Job
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: kubernetes/**

  scan:
    name: Image Scan
    needs: pre-job
    runs-on: ubuntu-latest
    if: ${{ needs.pre-job.outputs.any_changed == 'true' }}
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: "${{ secrets.BOT_APP_ID }}"
          private-key: "${{ secrets.BOT_APP_PRIVATE_KEY }}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install: true
          cache: true

      - name: Setup flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5
        with:
          cache: "true"
          base: ""

      - name: Trivy Cache Key
        id: trivy-cache-key
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # A stale database scans clean and means nothing, so the key moves daily.
      - name: Restore Trivy Database
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .trivy-cache
          key: trivy-db-${{ steps.trivy-cache-key.outputs.date }}
          restore-keys: trivy-db-

      - name: Scan New Images
        id: scan
        continue-on-error: true
        env:
          TRIVY_CACHE_DIR: .trivy-cache
          SUMMARY: scan-report.md
        run: |
          ./scripts/scan-new-images.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

      - name: Job Summary
        if: always() && hashFiles('scan-report.md') != ''
        run: cat scan-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Add Comment
        if: always() && hashFiles('scan-report.md') != ''
        continue-on-error: true
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12
        with:
          message-id: "${{ github.event.pull_request.number }}/kubernetes/image-scan"
          message-failure: Image scan was not successful
          message-path: scan-report.md
          repo-token: "${{ steps.app-token.outputs.token }}"

      # continue-on-error above keeps the comment posting, so the verdict is restored here.
      - name: Verdict
        if: steps.scan.outcome == 'failure'
        run: exit 1
